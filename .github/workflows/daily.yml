name: 音乐科技雷达 · 每日出版

on:
  schedule:
    # 主班次:UTC 23:05 = 北京时间 07:05
    - cron: '5 23 * * *'
    # 补刊班次:UTC 00:05 = 北京时间 08:05(幂等:已出版且已送达则直接结束,只补缺失环节)
    - cron: '5 0 * * *'
  workflow_dispatch: {} # 手动补跑入口

permissions:
  contents: write   # 回写 archive.json / state.json / index.html / word/
  pages: write      # 部署 GitHub Pages
  id-token: write

concurrency:
  group: radar-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      QQ_MAIL_USER: ${{ secrets.QQ_MAIL_USER }}
      QQ_SMTP_AUTH: ${{ secrets.QQ_SMTP_AUTH }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt certifi

      - name: 每日出版(幂等)
        run: python3 scripts/daily.py --page-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: 回写产物到仓库
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add archive.json state.json index.html word/ build/
          git diff --cached --quiet && echo "无变化,跳过提交" || git commit -m "出版 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git push

      - name: 打包 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v4
